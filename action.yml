name: 'DevOps Sentinel'
description: 'Rule-based DevOps and security scanner for pull requests, with AI-assisted explanations and fixes'
author: 'nandanaa03'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  openrouter-api-key:
    description: 'OpenRouter API key used for generating explanations of detected findings'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests
      shell: bash

    - name: Run DevOps Sentinel
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: python ${{ github.action_path }}/scripts/review.py
      shell: bash